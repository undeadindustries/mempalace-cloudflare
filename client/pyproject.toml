[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mempalace-cloudflare-remote"
version = "0.1.0"
description = "Cloudflare Remote Backend Plugin for MemPalace"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.entry-points."mempalace.backends"]
cloudflare-remote = "mempalace_cloudflare_remote:CloudflareRemoteBackend"
